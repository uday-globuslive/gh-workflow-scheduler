<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cron Scheduler{% endblock %}</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#656d76; --border:#d0d7de; --accent:#0969da; --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    header { background:#24292f; color:#fff; padding:.8rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
    header a, header button.link { color:#fff; text-decoration:none; }
    .brand { font-weight:600; font-size:1.1rem; }
    nav { display:flex; gap:1rem; align-items:center; }
    main { max-width:1100px; margin:1.5rem auto; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1.2rem; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.55rem .5rem; border-bottom:1px solid var(--border); vertical-align:top; font-size:.92rem; }
    th { color:var(--muted); font-weight:600; }
    code { background:#eff1f3; padding:.1rem .35rem; border-radius:4px; font-size:.88em; }
    .muted { color:var(--muted); font-size:.85rem; }
    .btn { display:inline-block; border:1px solid var(--border); background:#f6f8fa; color:var(--text); padding:.35rem .75rem; border-radius:6px; font-size:.88rem; cursor:pointer; text-decoration:none; }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn-danger { color:var(--bad); }
    button.link { background:none; border:none; cursor:pointer; font:inherit; padding:0; }
    form.inline { display:inline; }
    .actions { display:flex; gap:.35rem; flex-wrap:wrap; }
    .badge { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.78rem; font-weight:600; border:1px solid currentColor; }
    .st-succeeded, .st-enabled { color:var(--ok); }
    .st-failed { color:var(--bad); }
    .st-skipped, .st-disabled { color:var(--warn); }
    .flash { padding:.6rem .9rem; border-radius:6px; margin-bottom:.6rem; }
    .flash-success { background:#dafbe1; }
    .flash-error { background:#ffebe9; }
    label { display:block; font-weight:600; margin:.8rem 0 .25rem; font-size:.9rem; }
    input[type=text], input[type=password], textarea { width:100%; padding:.45rem .6rem; border:1px solid var(--border); border-radius:6px; font:inherit; }
    textarea { font-family: ui-monospace, Consolas, monospace; min-height:6rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:0 1rem; }
    .help { color:var(--muted); font-size:.8rem; margin-top:.2rem; }
  </style>
</head>
<body>
<header>
  <a href="{{ url_for('web.index') }}" class="brand">Cron Scheduler</a>
  {% if current_user %}
  <nav>
    <a href="{{ url_for('web.index') }}">Jobs</a>
    <a href="{{ url_for('web.new_job') }}">New job</a>
    <form method="post" action="{{ url_for('web.logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link" type="submit">Log out ({{ current_user }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
